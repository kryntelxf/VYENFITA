# ============================================================
# VYENFITA Docker Compose Override
# ============================================================
# This file extends the base Appsmith docker-compose.yml
# to add VYENFITA AI Service and integrate it with Appsmith.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d
#
# Environment variables:
#   - OPENAI_API_KEY: Your OpenAI API key
#   - ANTHROPIC_API_KEY: Your Anthropic API key (optional)
#   - AI_API_KEYS: Comma-separated API keys for AI Service
#   - AI_PROVIDER: Default provider (openai|anthropic)
# ============================================================

version: '3.8'

services:
  # ==========================================================
  # VYENFITA AI SERVICE
  # ==========================================================
  vyenfita-ai:
    image: vyenfita-ai:latest
    build:
      context: ./app/ai
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 24.14.1
    container_name: vyenfita-ai
    restart: unless-stopped
    ports:
      - "3001:3001"          # AI Service HTTP port
      - "9090:9090"          # Metrics port (optional)
    environment:
      # Node.js
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      
      # Service Configuration
      - AI_SERVICE_PORT=3001
      - AI_SERVICE_HOST=0.0.0.0
      - AI_LOG_LEVEL=${AI_LOG_LEVEL:-info}
      
      # AI Providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-4096}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.7}
      - OPENAI_TIMEOUT=${OPENAI_TIMEOUT:-60000}
      
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-opus-20240229}
      - ANTHROPIC_MAX_TOKENS=${ANTHROPIC_MAX_TOKENS:-4096}
      - ANTHROPIC_TEMPERATURE=${ANTHROPIC_TEMPERATURE:-0.7}
      - ANTHROPIC_TIMEOUT=${ANTHROPIC_TIMEOUT:-60000}
      
      # Google Gemini (optional)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      
      # General AI Settings
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.7}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-4096}
      
      # Security
      - AI_API_KEYS=${AI_API_KEYS:-vyenfita-default-key}
      - AI_RATE_LIMIT_ENABLED=${AI_RATE_LIMIT_ENABLED:-true}
      - AI_RATE_LIMIT_MAX_REQUESTS=${AI_RATE_LIMIT_MAX_REQUESTS:-100}
      - AI_RATE_LIMIT_WINDOW_MS=${AI_RATE_LIMIT_WINDOW_MS:-60000}
      - AI_RATE_LIMIT_SKIP_SUCCESSFUL=${AI_RATE_LIMIT_SKIP_SUCCESSFUL:-false}
      
      # Caching
      - AI_ENABLE_CACHING=${AI_ENABLE_CACHING:-true}
      - AI_CACHE_TTL=${AI_CACHE_TTL:-3600}
      - AI_CACHE_MAX_ITEMS=${AI_CACHE_MAX_ITEMS:-1000}
      
      # Feature Flags
      - AI_ENABLE_APPLICATION_GENERATION=${AI_ENABLE_APPLICATION_GENERATION:-true}
      - AI_ENABLE_WORKFLOW_GENERATION=${AI_ENABLE_WORKFLOW_GENERATION:-true}
      - AI_ENABLE_ANALYTICS=${AI_ENABLE_ANALYTICS:-true}
      - AI_ENABLE_AUTOMATION=${AI_ENABLE_AUTOMATION:-true}
      - AI_ENABLE_DEBUGGING=${AI_ENABLE_DEBUGGING:-false}
      
      # Performance
      - AI_MAX_CONCURRENT_REQUESTS=${AI_MAX_CONCURRENT_REQUESTS:-10}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-30000}
      - AI_RETRY_ATTEMPTS=${AI_RETRY_ATTEMPTS:-3}
      - AI_RETRY_BACKOFF_MS=${AI_RETRY_BACKOFF_MS:-1000}
      
      # Monitoring
      - AI_ENABLE_METRICS=${AI_ENABLE_METRICS:-true}
      - AI_METRICS_PORT=${AI_METRICS_PORT:-9090}
      - AI_ENABLE_HEALTH_CHECK=${AI_ENABLE_HEALTH_CHECK:-true}
      
      # Integration with Appsmith
      - APPSMITH_API_URL=http://appsmith:8080/api/v1
      - APPSMITH_API_KEY=${APPSMITH_API_KEY:-}
      
      # Logging
      - AI_ENABLE_AUDIT_LOGS=${AI_ENABLE_AUDIT_LOGS:-true}
      - AI_LOG_FILE_PATH=/app/logs/ai-service.log
    volumes:
      # Logs directory
      - ./app/ai/logs:/app/logs
      # Optional: mount for development
      # - ./app/ai:/app
    networks:
      - appsmith
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - appsmith
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================
  # APPSMITH WITH AI INTEGRATION
  # ==========================================================
  appsmith:
    # Base Appsmith service is defined in docker-compose.yml
    # We're extending it here with AI-specific environment variables
    environment:
      # VYENFITA AI Configuration
      - APPSMITH_AI_ENABLED=${APPSMITH_AI_ENABLED:-true}
      - APPSMITH_AI_SERVICE_URL=http://vyenfita-ai:3001
      - APPSMITH_AI_API_KEY=${AI_API_KEYS:-vyenfita-default-key}
      - APPSMITH_AI_TIMEOUT=${APPSMITH_AI_TIMEOUT:-30000}
      - APPSMITH_AI_DEFAULT_PROVIDER=${AI_PROVIDER:-openai}
      
      # Feature Flags
      - APPSMITH_FEATURE_AI_APPLICATION_GENERATION=${APPSMITH_FEATURE_AI_APPLICATION_GENERATION:-true}
      - APPSMITH_FEATURE_AI_WORKFLOW_GENERATION=${APPSMITH_FEATURE_AI_WORKFLOW_GENERATION:-true}
      - APPSMITH_FEATURE_AI_AUTOMATION=${APPSMITH_FEATURE_AI_AUTOMATION:-true}
      - APPSMITH_FEATURE_AI_ANALYTICS=${APPSMITH_FEATURE_AI_ANALYTICS:-true}
      
      # AI Service Health Check
      - APPSMITH_AI_HEALTH_CHECK_INTERVAL=${APPSMITH_AI_HEALTH_CHECK_INTERVAL:-60}
      - APPSMITH_AI_HEALTH_CHECK_TIMEOUT=${APPSMITH_AI_HEALTH_CHECK_TIMEOUT:-5}
      
      # AI Service Retry Configuration
      - APPSMITH_AI_RETRY_ATTEMPTS=${APPSMITH_AI_RETRY_ATTEMPTS:-3}
      - APPSMITH_AI_RETRY_BACKOFF_MS=${APPSMITH_AI_RETRY_BACKOFF_MS:-1000}
      
      # AI Service Circuit Breaker
      - APPSMITH_AI_CIRCUIT_BREAKER_ENABLED=${APPSMITH_AI_CIRCUIT_BREAKER_ENABLED:-true}
      - APPSMITH_AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD=${APPSMITH_AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:-5}
      - APPSMITH_AI_CIRCUIT_BREAKER_TIMEOUT_MS=${APPSMITH_AI_CIRCUIT_BREAKER_TIMEOUT_MS:-30000}
    depends_on:
      vyenfita-ai:
        condition: service_healthy
    networks:
      - appsmith

  # ==========================================================
  # OPTIONAL: AI SERVICE MONITORING
  # ==========================================================
  # Uncomment below to enable Prometheus monitoring for AI Service
  # ==========================================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: vyenfita-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9091:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   networks:
  #     - appsmith
  #   depends_on:
  #     - vyenfita-ai

  # ==========================================================
  # OPTIONAL: AI SERVICE LOGGING
  # ==========================================================
  # Uncomment below to enable centralized logging with ELK
  # ==========================================================
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   container_name: vyenfita-elasticsearch
  #   restart: unless-stopped
  #   ports:
  #     - "9200:9200"
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   networks:
  #     - appsmith
  #
  # logstash:
  #   image: docker.elastic.co/logstash/logstash:8.11.0
  #   container_name: vyenfita-logstash
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
  #   networks:
  #     - appsmith
  #   depends_on:
  #     - elasticsearch
  #
  # kibana:
  #   image: docker.elastic.co/kibana/kibana:8.11.0
  #   container_name: vyenfita-kibana
  #   restart: unless-stopped
  #   ports:
  #     - "5601:5601"
  #   environment:
  #     - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
  #   networks:
  #     - appsmith
  #   depends_on:
  #     - elasticsearch

# ============================================================
# NETWORKS
# ============================================================
networks:
  appsmith:
    name: appsmith
    driver: bridge

# ============================================================
# VOLUMES
# ============================================================
volumes:
  # Uncomment if using Prometheus
  # prometheus_data:
  #   driver: local
  
  # Uncomment if using Elasticsearch
  # elasticsearch_data:
  #   driver: local

# ============================================================
# ENVIRONMENT VARIABLES REFERENCE
# ============================================================
# 
# Required:
#   OPENAI_API_KEY         - OpenAI API key
#   AI_API_KEYS            - Comma-separated API keys for AI Service
#
# Optional:
#   ANTHROPIC_API_KEY      - Anthropic API key
#   AI_PROVIDER            - Default provider (openai|anthropic)
#   AI_LOG_LEVEL           - Log level (debug|info|warn|error)
#   AI_ENABLE_CACHING      - Enable response caching (true|false)
#   AI_RATE_LIMIT_ENABLED  - Enable rate limiting (true|false)
#
# Example:
#   OPENAI_API_KEY=sk-... AI_API_KEYS=key1,key2 docker-compose -f docker-compose.yml -f docker-compose.override.yml up -d
# ============================================================
