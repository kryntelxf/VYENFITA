name: VYENFITA Build Verify

on:
  workflow_dispatch:
  push:
    branches:
      - vyenfita-development

jobs:
  build:
    name: Build VYENFITA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'
          cache: 'npm'
          cache-dependency-path: 'app/client/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.9.6'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('app/server/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache client dependencies
        uses: actions/cache@v4
        with:
          path: app/client/node_modules
          key: ${{ runner.os }}-client-${{ hashFiles('app/client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-client-

      - name: Cache RTS dependencies
        uses: actions/cache@v4
        with:
          path: app/client/packages/rts/node_modules
          key: ${{ runner.os }}-rts-${{ hashFiles('app/client/packages/rts/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-rts-

      - name: Build client
        id: client-build
        run: |
          echo "=== BUILDING CLIENT ==="
          cd app/client
          echo "Installing dependencies..."
          npm ci
          echo "Building..."
          npm run build
          cd ../..
          echo "✅ Client build completed"
          ls -la app/client/build | head -10

      - name: Build server
        id: server-build
        run: |
          echo "=== BUILDING SERVER ==="
          cd app/server
          echo "Building with Maven..."
          mvn clean install -DskipTests
          cd ../..
          echo "✅ Server build completed"
          ls -la app/server/target/*.jar | head -5

      - name: Build RTS
        id: rts-build
        run: |
          echo "=== BUILDING RTS ==="
          cd app/client/packages/rts
          echo "Installing dependencies..."
          npm ci
          echo "Building..."
          npm run build
          cd ../../../..
          echo "✅ RTS build completed"
          ls -la app/client/packages/rts/dist | head -10

      - name: Verify build artifacts
        run: |
          echo "=== VERIFYING BUILD ARTIFACTS ==="
          
          echo "Client build:"
          if [ -d "app/client/build" ] && [ -f "app/client/build/index.html" ]; then
            echo "✅ Client build verified"
          else
            echo "❌ Client build not found"
            exit 1
          fi
          
          echo "Server build:"
          if [ -d "app/server/target" ] && [ "$(ls -1 app/server/target/*.jar 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ Server build verified"
          else
            echo "❌ Server build not found"
            exit 1
          fi
          
          echo "RTS build:"
          if [ -d "app/client/packages/rts/dist" ]; then
            echo "✅ RTS build verified"
          else
            echo "❌ RTS build not found"
            exit 1
          fi
          
          echo ""
          echo "=== ALL BUILDS VERIFIED SUCCESSFULLY ==="

      - name: Build result
        run: |
          echo "=== VYENFITA BUILD COMPLETED ==="
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo "Status: SUCCESS"
