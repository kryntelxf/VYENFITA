name: VYENFITA Build Verify

on:
  workflow_dispatch:
  push:
    branches:
      - vyenfita-development

jobs:
  build:
    name: Build VYENFITA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.9.6'

      - name: Build with Appsmith script
        run: |
          echo "=== VYENFITA BUILD ==="
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Java: $(java -version 2>&1 | head -1)"
          echo "Maven: $(mvn --version | head -1)"
          
          echo ""
          echo "=== USING APPSMITH BUILD SCRIPT ==="
          
          # Cari script build yang tersedia
          if [ -f "scripts/build.sh" ]; then
            echo "Found scripts/build.sh"
            chmod +x scripts/build.sh
            ./scripts/build.sh
          elif [ -f "build.sh" ]; then
            echo "Found build.sh"
            chmod +x build.sh
            ./build.sh
          elif [ -f "app/client/package.json" ] && [ -f "app/server/pom.xml" ]; then
            echo "No build script found. Building manually..."
            
            # Build backend
            echo "=== Building server ==="
            cd app/server
            mvn clean install -DskipTests
            cd ../..
            
            # Build frontend with npm 7+ workspace support
            echo "=== Building client ==="
            cd app/client
            npm install --legacy-peer-deps --workspaces=false
            npm run build
            cd ../..
            
            # Build RTS
            echo "=== Building RTS ==="
            cd app/client/packages/rts
            npm install --legacy-peer-deps
            npm run build
            cd ../../../..
          else
            echo "❌ No build method found"
            exit 1
          fi

      - name: Verify build
        run: |
          echo "=== VERIFYING BUILD ==="
          
          # Cek client build
          if [ -d "app/client/build" ] && [ -f "app/client/build/index.html" ]; then
            echo "✅ Client build OK"
          else
            echo "⚠️ Client build not found at app/client/build"
            find . -name "build" -type d 2>/dev/null | head -5
          fi
          
          # Cek server build
          if [ -d "app/server/target" ] && [ "$(ls -1 app/server/target/*.jar 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ Server build OK"
          else
            echo "⚠️ Server build not found"
          fi
          
          # Cek RTS build
          if [ -d "app/client/packages/rts/dist" ]; then
            echo "✅ RTS build OK"
          else
            echo "⚠️ RTS build not found"
          fi
          
          echo ""
          echo "=== BUILD COMPLETE ==="
