name: VYENFITA Docker Verify

on:
  workflow_dispatch:
  push:
    branches:
      - vyenfita-development

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository structure
        run: |
          echo "=== VYENFITA REPOSITORY STRUCTURE ==="
          ls -la
          echo ""
          echo "=== CHECKING CORE FILES ==="
          [ -f "README.md" ] && echo "✅ README.md found"
          [ -f "LICENSE" ] && echo "✅ LICENSE found"
          [ -d "app" ] && echo "✅ app/ directory found"
          [ -d "app/client" ] && echo "✅ app/client/ found"
          [ -d "app/server" ] && echo "✅ app/server/ found"
          [ -f "docker-compose.yml" ] && echo "✅ docker-compose.yml found"
          echo ""
          echo "=== VYENFITA REPOSITORY VERIFIED ==="

      - name: Pull Appsmith CE image
        run: |
          echo "=== PULLING APPSMITH CE ==="
          docker pull appsmith/appsmith-ce:latest
          docker images | grep appsmith

      - name: Run Appsmith container
        run: |
          echo "=== RUNNING APPSMITH CONTAINER ==="
          docker run -d \
            --name appsmith \
            -p 8080:80 \
            appsmith/appsmith-ce:latest
          docker ps | grep appsmith

      - name: Wait for service to be ready
        run: |
          echo "=== WAITING FOR SERVICE ==="
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|302\|401"; then
              echo "✅ Service is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "❌ Service did not start in time"
          docker logs appsmith --tail 50
          exit 1

      - name: Verify API health
        run: |
          echo "=== VERIFYING API ==="
          curl -s http://localhost:8080/api/v1/health | head -20 || echo "Health check not available"
          echo ""
          echo "=== CONTAINER STATUS ==="
          docker ps | grep appsmith
          echo ""
          echo "✅ VYENFITA Docker verification complete"

      - name: Cleanup
        if: always()
        run: |
          docker stop appsmith || true
          docker rm appsmith || true
