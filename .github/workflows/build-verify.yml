name: VYENFITA Build Discovery

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect repository build configuration
        run: |
          set -e

          echo "=== ROOT ==="
          ls -la

          echo "=== SCRIPTS ==="
          find scripts -maxdepth 3 -type f -print | sort

          echo "=== PACKAGE FILES ==="
          find . -maxdepth 4 \
            \( -name "package.json" -o -name "pom.xml" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
            -not -path "./.git/*" \
            -print | sort

          echo "=== POSSIBLE BUILD DOCUMENTATION ==="
          grep -RniE \
            "build.sh|build command|build instructions|npm run build|mvn |gradle |docker build" \
            README.md docs scripts 2>/dev/null | head -100 || true

          echo "=== GIT VERSION ==="
          git rev-parse HEAD

          echo "=== BRANCH ==="
          git branch --show-current

          echo "=== END DISCOVERY ==="
