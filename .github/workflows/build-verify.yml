name: VYENFITA Build Verify

on:
  workflow_dispatch:
  push:
    branches:
      - vyenfita-development

jobs:
  build:
    name: Build VYENFITA
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.9.6'

      - name: Build client
        id: client-build
        run: |
          echo "=== BUILDING CLIENT ==="
          cd app/client
          echo "Node version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Installing dependencies with --legacy-peer-deps..."
          echo "NOTE: react-custom-scrollbars@4.2.1 requires React 16 but project uses React 17"
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          echo "Building..."
          npm run build
          cd ../..
          echo "✅ Client build completed"
          ls -la app/client/build | head -10

      - name: Build server
        id: server-build
        run: |
          echo "=== BUILDING SERVER ==="
          cd app/server
          echo "Java version: $(java -version 2>&1 | head -1)"
          echo "Maven version: $(mvn --version | head -1)"
          echo "Building with Maven..."
          mvn clean install -DskipTests
          cd ../..
          echo "✅ Server build completed"
          ls -la app/server/target/*.jar | head -5

      - name: Build RTS
        id: rts-build
        run: |
          echo "=== BUILDING RTS ==="
          cd app/client/packages/rts
          echo "Installing dependencies..."
          npm ci || npm install
          echo "Building..."
          npm run build
          cd ../../../..
          echo "✅ RTS build completed"
          ls -la app/client/packages/rts/dist | head -10

      - name: Verify build artifacts
        run: |
          echo "=== VERIFYING BUILD ARTIFACTS ==="
          
          echo "Client build:"
          if [ -d "app/client/build" ] && [ -f "app/client/build/index.html" ]; then
            echo "✅ Client build verified"
          else
            echo "❌ Client build not found"
            exit 1
          fi
          
          echo "Server build:"
          if [ -d "app/server/target" ] && [ "$(ls -1 app/server/target/*.jar 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "✅ Server build verified"
          else
            echo "❌ Server build not found"
            exit 1
          fi
          
          echo "RTS build:"
          if [ -d "app/client/packages/rts/dist" ]; then
            echo "✅ RTS build verified"
          else
            echo "❌ RTS build not found"
            exit 1
          fi
          
          echo ""
          echo "=== ALL BUILDS VERIFIED SUCCESSFULLY ==="

      - name: Build result
        run: |
          echo "=== VYENFITA BUILD COMPLETED ==="
          echo "Commit: $(git rev-parse --short HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo "Status: SUCCESS"
          
      - name: Technical Debt Report
        if: always()
        run: |
          echo "=== TECHNICAL DEBT REPORT ==="
          echo ""
          echo "1. react-custom-scrollbars@4.2.1"
          echo "   - Issue: Requires React 16, but project uses React 17"
          echo "   - Resolution: Using --legacy-peer-deps (temporary)"
          echo "   - Fix: Upgrade to react-custom-scrollbars@4.2.2 or newer"
          echo "   - Priority: MEDIUM"
          echo ""
          echo "2. Dockerfile ARG BASE"
          echo "   - Issue: No default value for ARG BASE"
          echo "   - Resolution: Passed via --build-arg in workflow"
          echo "   - Fix: Add default value in Dockerfile"
          echo "   - Priority: LOW"
          echo ""
          echo "3. Cache dependencies"
          echo "   - Issue: Cache step failed because package-lock.json path not found"
          echo "   - Resolution: Removed cache for now"
          echo "   - Fix: Add cache back after verifying correct package-lock.json location"
          echo "   - Priority: LOW"
          echo ""
          echo "=== END OF TECHNICAL DEBT REPORT ==="
