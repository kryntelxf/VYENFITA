name: VYENFITA Build Verify

on:
  workflow_dispatch:
  push:
    branches:
      - vyenfita-development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show environment
        run: |
          echo "=== ENVIRONMENT ==="
          node --version
          npm --version
          java -version
          docker --version
          free -h
          df -h

      - name: Inspect repository structure
        run: |
          echo "=== REPOSITORY STRUCTURE ==="
          echo "Root directory contents:"
          ls -la

          echo ""
          echo "=== CHECKING FOR BUILD FILES ==="
          echo "Looking for build.sh:"
          find . -maxdepth 2 -name "build.sh" -type f || echo "build.sh: NOT FOUND"

          echo ""
          echo "Looking for Dockerfile:"
          find . -maxdepth 2 -name "Dockerfile" -type f || echo "Dockerfile: NOT FOUND"

          echo ""
          echo "Looking for docker-compose.yml:"
          find . -maxdepth 2 -name "docker-compose.yml" -type f || echo "docker-compose.yml: NOT FOUND"

          echo ""
          echo "Looking for package.json:"
          find . -maxdepth 2 -name "package.json" -type f || echo "package.json: NOT FOUND"

          echo ""
          echo "Looking for pom.xml:"
          find . -maxdepth 2 -name "pom.xml" -type f || echo "pom.xml: NOT FOUND"

          echo ""
          echo "Looking for appsmith-server directory:"
          ls -la appsmith-server 2>/dev/null || echo "appsmith-server: NOT FOUND"

          echo ""
          echo "Looking for appsmith-client directory:"
          ls -la appsmith-client 2>/dev/null || echo "appsmith-client: NOT FOUND"

          echo ""
          echo "=== SCRIPTS DIRECTORY ==="
          ls -la scripts 2>/dev/null || echo "scripts: NOT FOUND"

          echo ""
          echo "=== APP DIRECTORY STRUCTURE ==="
          if [ -d app ]; then
            echo "app directory found. Contents:"
            ls -la app
            if [ -d app/client ]; then
              echo "app/client found. Contents:"
              ls -la app/client | head -20
            fi
            if [ -d app/server ]; then
              echo "app/server found. Contents:"
              ls -la app/server | head -20
            fi
          else
            echo "app directory NOT FOUND"
          fi

      - name: Build frontend and RTS first
        run: |
          set -e
          echo "=== BUILDING FRONTEND AND RTS ==="

          echo "Installing frontend dependencies..."
          cd app/client
          npm ci || npm install
          cd ../..

          echo "Building frontend..."
          cd app/client
          npm run build
          cd ../..

          echo "Building RTS..."
          cd app/client/packages/rts
          npm ci || npm install
          npm run build
          cd ../../../..

          echo "=== FRONTEND AND RTS BUILD COMPLETED ==="
          echo "Checking build artifacts:"
          ls -la app/client/build 2>/dev/null || echo "app/client/build NOT FOUND - FAILED"
          ls -la app/client/packages/rts/dist 2>/dev/null || echo "app/client/packages/rts/dist NOT FOUND - FAILED"

      - name: Build Docker image
        run: |
          set -e
          echo "=== BUILDING DOCKER IMAGE ==="
          docker build \
            --build-arg BASE=ubuntu:22.04 \
            --build-arg APPSMITH_CLOUD_SERVICES_BASE_URL=http://localhost:8080 \
            -t vyenfita:latest .

      - name: Verify Docker image
        run: |
          echo "=== VERIFYING DOCKER IMAGE ==="
          docker images | grep vyenfita
          docker history vyenfita:latest

      - name: Build result
        run: |
          echo "=== BUILD COMPLETED SUCCESSFULLY ==="
          git rev-parse --short HEAD
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep vyenfita || echo "Image not found"
