name: E2E — VYENFITA Builder

on:
  workflow_dispatch:
  push:
    branches:
      - vyenfita-development
    paths:
      - 'app/client/src/vyenfita/**'
      - 'app/client/e2e/**'
      - '.github/workflows/e2e-builder.yml'

jobs:
  e2e:
    name: Builder E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if E2E folder exists
        id: check
        run: |
          if [ -d "app/client/e2e" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ app/client/e2e folder not found — skipping"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install client dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          cd app/client
          yarn install --frozen-lockfile || yarn install

      - name: Install E2E dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          cd app/client/e2e
          yarn install --frozen-lockfile || yarn install

      - name: Install Playwright browsers
        if: steps.check.outputs.exists == 'true'
        run: |
          cd app/client/e2e
          npx playwright install --with-deps chromium

      - name: Start client dev server
        if: steps.check.outputs.exists == 'true'
        run: |
          cd app/client
          nohup yarn start > /tmp/client.log 2>&1 &
          echo "Waiting for client to be ready..."
          for i in {1..60}; do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "✅ Client ready"
              break
            fi
            echo "Attempt $i/60..."
            sleep 5
          done

      - name: Run Playwright tests
        if: steps.check.outputs.exists == 'true'
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          cd app/client/e2e
          npx playwright test --reporter=list

      - name: Upload test results
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            app/client/e2e/playwright-report/
            app/client/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show client log on failure
        if: failure() && steps.check.outputs.exists == 'true'
        run: |
          echo "=== CLIENT LOG ==="
          tail -100 /tmp/client.log || echo "no log"
