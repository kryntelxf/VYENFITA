name: Test Suite

on:
  push:
    branches:
      - vyenfita-development
    paths:
      - 'app/ai/**'
  pull_request:
    branches:
      - vyenfita-development
      - release
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vyenfita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/vyenfita_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/vyenfita_test
      JWT_SECRET: test-secret-key-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'

      - name: Install dependencies
        run: |
          cd app/ai
          yarn install --frozen-lockfile || yarn install

      - name: Generate Prisma Client
        run: |
          cd app/ai
          npx prisma generate

      - name: Apply migrations
        run: |
          cd app/ai
          npx prisma migrate deploy || npx prisma db push

      - name: Seed database
        run: |
          cd app/ai
          yarn db:seed || echo "Seed skipped (non-fatal)"

      - name: Run tests
        run: |
          cd app/ai
          yarn test --ci --coverage --reporters=default

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: app/ai/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Test summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Test workflow executed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: If some steps showed warnings, they were non-fatal." >> $GITHUB_STEP_SUMMARY
