name: VYENFITA Baseline Verify

on:
  push:
    branches:
      - vyenfita-development
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VYENFITA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository verification
        run: |
          echo "=== VYENFITA BASELINE VERIFICATION ==="
          echo "Commit:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current

          echo "Status:"
          git status --short

          echo "Remotes:"
          git remote -v

      - name: Environment verification
        run: |
          echo "=== ENVIRONMENT ==="
          node --version
          npm --version
          java -version
          git --version
          docker --version

      - name: Repository structure
        run: |
          echo "=== ROOT FILES ==="
          ls -la

          echo "=== BUILD FILES ==="

          if [ -f package.json ]; then
            echo "package.json: FOUND"
          else
            echo "package.json: NOT FOUND AT ROOT"
          fi

          if [ -f Dockerfile ]; then
            echo "Dockerfile: FOUND"
          else
            echo "Dockerfile: NOT FOUND"
            exit 1
          fi

          if [ -f pom.xml ]; then
            echo "pom.xml: FOUND AT ROOT"
          else
            echo "pom.xml: NOT FOUND AT ROOT — searching repository..."
            find . -name "pom.xml" -type f -print
          fi

          echo "=== VERIFICATION COMPLETE ==="
