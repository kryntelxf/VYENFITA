# ============================================
# APPSMITH SERVER CONFIGURATION
# ============================================

# Server
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.context-path=/api

# ============================================
# DATABASE CONFIGURATION
# ============================================

# MongoDB
spring.data.mongodb.uri=${APPSMITH_DB_URL:mongodb://localhost:27017/appsmith?replicaSet=rs0}
spring.data.mongodb.database=appsmith
spring.data.mongodb.auto-index-creation=true

# ============================================
# REDIS CONFIGURATION
# ============================================

# Redis
spring.redis.url=${APPSMITH_REDIS_URI:redis://localhost:6379}
spring.redis.timeout=5000ms
spring.redis.lettuce.pool.max-active=50
spring.redis.lettuce.pool.max-idle=10
spring.redis.lettuce.pool.min-idle=5

# ============================================
# APPSMITH CORE CONFIGURATION
# ============================================

# Security
appsmith.encryption.password=${APPSMITH_ENCRYPTION_PASSWORD:abcd}
appsmith.encryption.salt=${APPSMITH_ENCRYPTION_SALT:abcd}
appsmith.encryption.key=${APPSMITH_ENCRYPTION_KEY:abcd}

# JWT
appsmith.jwt.secret=${APPSMITH_JWT_SECRET:abcd}
appsmith.jwt.expiry=86400000

# CORS
appsmith.cors.allowed-origins=${APPSMITH_CORS_ALLOWED_ORIGINS:*}
appsmith.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
appsmith.cors.allowed-headers=*

# Authentication
appsmith.auth.google.enabled=${APPSMITH_GOOGLE_AUTH_ENABLED:false}
appsmith.auth.google.client-id=${APPSMITH_GOOGLE_CLIENT_ID:}
appsmith.auth.google.client-secret=${APPSMITH_GOOGLE_CLIENT_SECRET:}

appsmith.auth.github.enabled=${APPSMITH_GITHUB_AUTH_ENABLED:false}
appsmith.auth.github.client-id=${APPSMITH_GITHUB_CLIENT_ID:}
appsmith.auth.github.client-secret=${APPSMITH_GITHUB_CLIENT_SECRET:}

# ============================================
# VYENFITA AI CONFIGURATION
# ============================================

# AI Service Integration
appsmith.ai.enabled=${APPSMITH_AI_ENABLED:true}
appsmith.ai.service.url=${APPSMITH_AI_SERVICE_URL:http://localhost:3001}
appsmith.ai.api.key=${APPSMITH_AI_API_KEY:vyenfita-default-key}
appsmith.ai.timeout=${APPSMITH_AI_TIMEOUT:30000}
appsmith.ai.provider=${APPSMITH_AI_PROVIDER:openai}
appsmith.ai.max-tokens=${APPSMITH_AI_MAX_TOKENS:4096}
appsmith.ai.temperature=${APPSMITH_AI_TEMPERATURE:0.7}

# AI Feature Flags
appsmith.ai.feature.application-generation=${APPSMITH_AI_FEATURE_APPLICATION_GENERATION:true}
appsmith.ai.feature.workflow-generation=${APPSMITH_AI_FEATURE_WORKFLOW_GENERATION:true}
appsmith.ai.feature.analytics=${APPSMITH_AI_FEATURE_ANALYTICS:true}
appsmith.ai.feature.automation=${APPSMITH_AI_FEATURE_AUTOMATION:true}
appsmith.ai.feature.debugging=${APPSMITH_AI_FEATURE_DEBUGGING:false}

# AI Caching
appsmith.ai.cache.enabled=${APPSMITH_AI_CACHE_ENABLED:true}
appsmith.ai.cache.ttl=${APPSMITH_AI_CACHE_TTL:3600}
appsmith.ai.cache.max-items=${APPSMITH_AI_CACHE_MAX_ITEMS:1000}

# AI Rate Limiting
appsmith.ai.rate-limit.enabled=${APPSMITH_AI_RATE_LIMIT_ENABLED:true}
appsmith.ai.rate-limit.max-requests=${APPSMITH_AI_RATE_LIMIT_MAX_REQUESTS:100}
appsmith.ai.rate-limit.window-ms=${APPSMITH_AI_RATE_LIMIT_WINDOW_MS:60000}

# AI Logging
appsmith.ai.log.level=${APPSMITH_AI_LOG_LEVEL:info}
appsmith.ai.log.audit=${APPSMITH_AI_LOG_AUDIT:true}

# AI Monitoring
appsmith.ai.metrics.enabled=${APPSMITH_AI_METRICS_ENABLED:true}
appsmith.ai.metrics.port=${APPSMITH_AI_METRICS_PORT:9090}

# ============================================
# MAIL CONFIGURATION
# ============================================

appsmith.mail.enabled=${APPSMITH_MAIL_ENABLED:false}
appsmith.mail.host=${APPSMITH_MAIL_HOST:smtp.gmail.com}
appsmith.mail.port=${APPSMITH_MAIL_PORT:587}
appsmith.mail.username=${APPSMITH_MAIL_USERNAME:}
appsmith.mail.password=${APPSMITH_MAIL_PASSWORD:}
appsmith.mail.from=${APPSMITH_MAIL_FROM:no-reply@vyenfita.com}
appsmith.mail.tls.enabled=${APPSMITH_MAIL_TLS_ENABLED:true}
appsmith.mail.auth.enabled=${APPSMITH_MAIL_AUTH_ENABLED:true}

# ============================================
# FILE STORAGE CONFIGURATION
# ============================================

appsmith.file-storage.type=${APPSMITH_FILE_STORAGE_TYPE:local}
appsmith.file-storage.local.path=${APPSMITH_FILE_STORAGE_LOCAL_PATH:./container-volumes}

# S3 (optional)
appsmith.file-storage.s3.access-key=${APPSMITH_S3_ACCESS_KEY:}
appsmith.file-storage.s3.secret-key=${APPSMITH_S3_SECRET_KEY:}
appsmith.file-storage.s3.region=${APPSMITH_S3_REGION:us-east-1}
appsmith.file-storage.s3.bucket=${APPSMITH_S3_BUCKET:}

# ============================================
# GIT STORAGE CONFIGURATION
# ============================================

appsmith.git.root=${APPSMITH_GIT_ROOT:./container-volumes/git-storage}

# ============================================
# LOGGING CONFIGURATION
# ============================================

logging.level.com.appsmith=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.security=INFO
logging.level.io.lettuce.core=INFO

# Log file
logging.file.name=appsmith.log
logging.file.path=./logs

# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# ACTUATOR / MONITORING
# ============================================

management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=vyenfita

# ============================================
# APPSMITH PLUGIN CONFIGURATION
# ============================================

appsmith.plugin.path=${APPSMITH_PLUGIN_PATH:./appsmith-plugins}
appsmith.plugin.load-mode=${APPSMITH_PLUGIN_LOAD_MODE:development}

# ============================================
# MISCELLANEOUS
# ============================================

appsmith.oauth2.client-registration.redirect-uri=${APPSMITH_OAUTH2_REDIRECT_URI:http://localhost:8080/api/v1/oauth2/redirect}
appsmith.oauth2.client-registration.scope=${APPSMITH_OAUTH2_SCOPE:openid,profile,email}

appsmith.analytics.enabled=${APPSMITH_ANALYTICS_ENABLED:true}
appsmith.analytics.url=${APPSMITH_ANALYTICS_URL:https://analytics.appsmith.com}

appsmith.segment.enabled=${APPSMITH_SEGMENT_ENABLED:false}
appsmith.segment.key=${APPSMITH_SEGMENT_KEY:}

appsmith.sentry.enabled=${APPSMITH_SENTRY_ENABLED:false}
appsmith.sentry.dsn=${APPSMITH_SENTRY_DSN:}

# ============================================
# PERFORMANCE CONFIGURATION
# ============================================

# Connection pools
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Thread pools
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100

# WebFlux
spring.codec.max-in-memory-size=10MB

# ============================================
# ENVIRONMENT SPECIFIC
# ============================================

# Development
---
spring.config.activate.on-profile=dev
appsmith.ai.service.url=http://localhost:3001
appsmith.ai.api.key=vyenfita-dev-key
appsmith.ai.enabled=true
logging.level.com.appsmith=DEBUG

# Production
---
spring.config.activate.on-profile=prod
appsmith.ai.service.url=http://vyenfita-ai:3001
appsmith.ai.api.key=${APPSMITH_AI_API_KEY}
appsmith.ai.enabled=true
logging.level.com.appsmith=INFO

# Test
---
spring.config.activate.on-profile=test
appsmith.ai.enabled=false
spring.data.mongodb.uri=mongodb://localhost:27017/appsmith-test
