# ============================================
# APPSMITH SERVER CONFIGURATION
# ============================================

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Spring Configuration
spring.application.name=appsmith
spring.main.allow-bean-definition-overriding=true
spring.main.lazy-initialization=false

# ============================================
# DATABASE CONFIGURATION
# ============================================

# MongoDB
spring.data.mongodb.uri=${APPSMITH_DB_URL:mongodb://localhost:27017/appsmith}
spring.data.mongodb.database=appsmith

# Redis
spring.redis.host=${APPSMITH_REDIS_HOST:localhost}
spring.redis.port=${APPSMITH_REDIS_PORT:6379}
spring.redis.password=${APPSMITH_REDIS_PASSWORD:}
spring.redis.ssl=${APPSMITH_REDIS_SSL:false}

# ============================================
# ENCRYPTION & SECURITY
# ============================================

appsmith.encryption.password=${APPSMITH_ENCRYPTION_PASSWORD:}
appsmith.encryption.salt=${APPSMITH_ENCRYPTION_SALT:}

# JWT Configuration
appsmith.jwt.secret=${APPSMITH_JWT_SECRET:}
appsmith.jwt.expiry=${APPSMITH_JWT_EXPIRY:86400000}
appsmith.jwt.refresh.expiry=${APPSMITH_JWT_REFRESH_EXPIRY:604800000}

# ============================================
# MAIL CONFIGURATION
# ============================================

appsmith.mail.enabled=${APPSMITH_MAIL_ENABLED:false}
appsmith.mail.host=${APPSMITH_MAIL_HOST:smtp.sendgrid.net}
appsmith.mail.port=${APPSMITH_MAIL_PORT:587}
appsmith.mail.username=${APPSMITH_MAIL_USERNAME:}
appsmith.mail.password=${APPSMITH_MAIL_PASSWORD:}
appsmith.mail.from=${APPSMITH_MAIL_FROM:admin@appsmith.com}
appsmith.mail.tls=${APPSMITH_MAIL_TLS:true}

# ============================================
# FILE STORAGE
# ============================================

appsmith.storage.type=${APPSMITH_STORAGE_TYPE:file}
appsmith.storage.root=${APPSMITH_STORAGE_ROOT:./storage}
appsmith.storage.s3.access.key=${APPSMITH_S3_ACCESS_KEY:}
appsmith.storage.s3.secret.key=${APPSMITH_S3_SECRET_KEY:}
appsmith.storage.s3.bucket=${APPSMITH_S3_BUCKET:}
appsmith.storage.s3.region=${APPSMITH_S3_REGION:us-east-1}

# ============================================
# GIT CONFIGURATION
# ============================================

appsmith.git.root=${APPSMITH_GIT_ROOT:./container-volumes/git-storage}
appsmith.git.ssh.private.key=${APPSMITH_GIT_SSH_PRIVATE_KEY:}
appsmith.git.ssh.public.key=${APPSMITH_GIT_SSH_PUBLIC_KEY:}

# ============================================
# LOGGING
# ============================================

logging.level.com.appsmith=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.mongodb.driver=INFO

# ============================================
# CORS CONFIGURATION
# ============================================

appsmith.cors.allowed.origins=${APPSMITH_CORS_ALLOWED_ORIGINS:*}
appsmith.cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
appsmith.cors.allowed.headers=*
appsmith.cors.allow.credentials=true

# ============================================
# CSRF CONFIGURATION
# ============================================

appsmith.csrf.enabled=${APPSMITH_CSRF_ENABLED:false}

# ============================================
# RATE LIMITING
# ============================================

appsmith.rate.limit.enabled=${APPSMITH_RATE_LIMIT_ENABLED:true}
appsmith.rate.limit.max.requests=${APPSMITH_RATE_LIMIT_MAX_REQUESTS:100}
appsmith.rate.limit.window.ms=${APPSMITH_RATE_LIMIT_WINDOW_MS:60000}

# ============================================
# AI SERVICE INTEGRATION
# ============================================

appsmith.ai.enabled=${APPSMITH_AI_ENABLED:true}
appsmith.ai.service.url=${APPSMITH_AI_SERVICE_URL:http://localhost:3001}
appsmith.ai.api.key=${APPSMITH_AI_API_KEY:vyenfita-default-key}
appsmith.ai.timeout=${APPSMITH_AI_TIMEOUT:30000}
appsmith.ai.default.provider=${APPSMITH_AI_DEFAULT_PROVIDER:openai}

# AI Feature Flags
appsmith.ai.features.application.generation=${APPSMITH_FEATURE_AI_APPLICATION_GENERATION:true}
appsmith.ai.features.workflow.generation=${APPSMITH_FEATURE_AI_WORKFLOW_GENERATION:true}
appsmith.ai.features.automation=${APPSMITH_FEATURE_AI_AUTOMATION:true}
appsmith.ai.features.analytics=${APPSMITH_FEATURE_AI_ANALYTICS:true}

# AI Health Check
appsmith.ai.health.check.interval=${APPSMITH_AI_HEALTH_CHECK_INTERVAL:60}
appsmith.ai.health.check.timeout=${APPSMITH_AI_HEALTH_CHECK_TIMEOUT:5}

# AI Retry Configuration
appsmith.ai.retry.attempts=${APPSMITH_AI_RETRY_ATTEMPTS:3}
appsmith.ai.retry.backoff.ms=${APPSMITH_AI_RETRY_BACKOFF_MS:1000}

# AI Circuit Breaker
appsmith.ai.circuit.breaker.enabled=${APPSMITH_AI_CIRCUIT_BREAKER_ENABLED:true}
appsmith.ai.circuit.breaker.failure.threshold=${APPSMITH_AI_CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
appsmith.ai.circuit.breaker.timeout.ms=${APPSMITH_AI_CIRCUIT_BREAKER_TIMEOUT_MS:30000}

# ============================================
# VYENFITA ENTERPRISE CONFIGURATION
# ============================================

# Multi-Tenant
appsmith.tenant.enabled=${APPSMITH_TENANT_ENABLED:true}
appsmith.tenant.default=${APPSMITH_TENANT_DEFAULT:default}

# Feature Flags (Enterprise)
appsmith.features.flags.sso=${APPSMITH_FEATURE_SSO:false}
appsmith.features.flags.audit_logs=${APPSMITH_FEATURE_AUDIT_LOGS:false}
appsmith.features.flags.advanced_rbac=${APPSMITH_FEATURE_ADVANCED_RBAC:false}
appsmith.features.flags.ai_premium_models=${APPSMITH_FEATURE_AI_PREMIUM:false}
appsmith.features.flags.unlimited_workspaces=${APPSMITH_FEATURE_UNLIMITED_WORKSPACES:false}

# Enterprise License
appsmith.enterprise.enabled=${APPSMITH_ENTERPRISE_ENABLED:false}
appsmith.enterprise.license.key=${APPSMITH_ENTERPRISE_LICENSE_KEY:}

# Commercial Features
appsmith.commercial.plan=${APPSMITH_COMMERCIAL_PLAN:community}
appsmith.commercial.max.users=${APPSMITH_COMMERCIAL_MAX_USERS:5}
appsmith.commercial.max.apps=${APPSMITH_COMMERCIAL_MAX_APPS:10}
appsmith.commercial.max.workspaces=${APPSMITH_COMMERCIAL_MAX_WORKSPACES:1}

# ============================================
# MONITORING & METRICS
# ============================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=${APPSMITH_METRICS_ENABLED:false}
management.health.mongo.enabled=true
management.health.redis.enabled=true

# ============================================
# SESSION CONFIGURATION
# ============================================

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=appsmith_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APPSMITH_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=Lax

# ============================================
# COMPRESSION
# ============================================

server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/html,text/css,text/plain

# ============================================
# ACTUATOR
# ============================================

management.info.build.enabled=true
management.info.env.enabled=true

# ============================================
# DEVELOPMENT CONFIGURATION
# ============================================

appsmith.development.enabled=${APPSMITH_DEVELOPMENT_ENABLED:false}
appsmith.development.allow.unsafe.origins=${APPSMITH_DEVELOPMENT_ALLOW_UNSAFE_ORIGINS:false}

# ============================================
# CLOUD SERVICES
# ============================================

appsmith.cloud.services.base.url=${APPSMITH_CLOUD_SERVICES_BASE_URL:http://localhost:8080}
appsmith.cloud.services.api.key=${APPSMITH_CLOUD_SERVICES_API_KEY:}

# ============================================
# SEGMENT ANALYTICS
# ============================================

appsmith.segment.ce.key=${APPSMITH_SEGMENT_CE_KEY:}
appsmith.segment.ee.key=${APPSMITH_SEGMENT_EE_KEY:}
appsmith.segment.enabled=${APPSMITH_SEGMENT_ENABLED:false}

# ============================================
# CUSTOM PLUGINS
# ============================================

appsmith.plugins.dir=${APPSMITH_PLUGINS_DIR:./plugins}

# ============================================
# WEBHOOKS
# ============================================

appsmith.webhook.url=${APPSMITH_WEBHOOK_URL:}
appsmith.webhook.secret=${APPSMITH_WEBHOOK_SECRET:}

# ============================================
# DOCUMENTATION
# ============================================

appsmith.documentation.url=${APPSMITH_DOCUMENTATION_URL:https://docs.appsmith.com}

# ============================================
# DEFAULT ADMIN
# ============================================

appsmith.default.admin.email=${APPSMITH_DEFAULT_ADMIN_EMAIL:admin@appsmith.com}
appsmith.default.admin.password=${APPSMITH_DEFAULT_ADMIN_PASSWORD:admin123}

# ============================================
# SSL CONFIGURATION (optional)
# ============================================

# server.ssl.enabled=${APPSMITH_SSL_ENABLED:false}
# server.ssl.key-store=${APPSMITH_SSL_KEYSTORE:}
# server.ssl.key-store-password=${APPSMITH_SSL_KEYSTORE_PASSWORD:}
# server.ssl.keyStoreType=${APPSMITH_SSL_KEYSTORE_TYPE:PKCS12}

# ============================================
# VYENFITA BRANDING
# ============================================

appsmith.branding.name=VYENFITA
appsmith.branding.logo=/images/vyenfita-logo.png
appsmith.branding.favicon=/images/vyenfita-favicon.ico
appsmith.branding.copyright=VYENFITA Team
appsmith.branding.url=https://github.com/kryntelxf/VYENFITA
