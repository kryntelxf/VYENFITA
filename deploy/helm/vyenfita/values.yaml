# ============================================================
# VYENFITA Helm Values
# ============================================================

# Global settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""

# AI Service (VYENFITA AI)
ai:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/kryntelxf/vyenfita-ai
    tag: "3.0.0"
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 3001
  
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2048Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  
  pdb:
    enabled: true
    minAvailable: 1
  
  # Config (non-sensitive)
  config:
    nodeEnv: production
    logLevel: info
    enableCaching: true
    cacheTtl: 3600
    rateLimitEnabled: true
    rateLimitMaxRequests: 1000
    rateLimitWindowMs: 60000
    maxConcurrentRequests: 50
    requestTimeoutMs: 30000
    retryAttempts: 3
    retryBackoffMs: 1000
    circuitBreakerFailureThreshold: 5
    circuitBreakerTimeoutMs: 30000
    schedulerEnabled: true
    schedulerPollIntervalMs: 30000
    enableMetrics: true
    metricsPort: 9090
    enableAuditLogs: true
    serviceVersion: "3.0.0"
    appsmithApiUrl: "http://appsmith:8080/api/v1"
    enableApplicationGeneration: true
    enableWorkflowGeneration: true
    enableAutomation: true

# Appsmith (optional, can be disabled if external)
appsmith:
  enabled: true
  image:
    repository: appsmith/appsmith-ce
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 1024Mi
    limits:
      cpu: 2000m
      memory: 4096Mi

# PostgreSQL (use external in production)
postgresql:
  enabled: false
  external:
    host: ""
    port: 5432
    database: vyenfita
    username: ""
    existingSecret: vyenfita-postgres-secret
    existingSecretPasswordKey: password

# Redis (optional)
redis:
  enabled: false
  external:
    host: ""
    port: 6379
    existingSecret: ""
    existingSecretPasswordKey: password

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: api.vyenfita.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vyenfita-ai-tls
      hosts:
        - api.vyenfita.com

# Service Account
serviceAccount:
  create: true
  name: vyenfita-ai
  annotations: {}

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# Network Policy
networkPolicy:
  enabled: true

# Observability
observability:
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    labels:
      release: prometheus
  prometheusRule:
    enabled: false
