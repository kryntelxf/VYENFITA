{{- if .Values.ai.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vyenfita.fullname" . }}-ai
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vyenfita.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai
spec:
  type: {{ .Values.ai.service.type }}
  selector:
    {{- include "vyenfita.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ai
  ports:
    - name: http
      port: {{ .Values.ai.service.port }}
      targetPort: http
      protocol: TCP
  sessionAffinity: None
{{- end }}
