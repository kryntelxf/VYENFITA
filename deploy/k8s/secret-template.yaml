# ============================================================
# VYENFITA Kubernetes Secrets (TEMPLATE)
# ============================================================
# DO NOT COMMIT ACTUAL SECRETS TO GIT
# 
# Create secrets via:
#   kubectl create secret generic vyenfita-ai-secrets \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=ENCRYPTION_KEY='...' \
#     --from-literal=OPENAI_API_KEY='...' \
#     --from-literal=ANTHROPIC_API_KEY='...' \
#     --from-literal=AI_API_KEYS='...' \
#     -n vyenfita
#
# Or use Sealed Secrets / External Secrets Operator.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: vyenfita-ai-secrets
  namespace: vyenfita
type: Opaque
stringData:
  # Replace with base64-encoded or use stringData (K8s encodes it)
  DATABASE_URL: "postgresql://user:password@host:5432/vyenfita?sslmode=require"
  JWT_SECRET: "REPLACE_WITH_SECURE_32_CHAR_RANDOM_STRING"
  ENCRYPTION_KEY: "REPLACE_WITH_SECURE_32_CHAR_RANDOM_STRING"
  OPENAI_API_KEY: "sk-REPLACE_WITH_YOUR_KEY"
  ANTHROPIC_API_KEY: ""
  AI_API_KEYS: "REPLACE_WITH_COMMA_SEPARATED_KEYS"
